<text x="60" y="1400" font-size="19"  fill="#111" font-family="Geist, 'Segoe UI', Arial, sans-serif">промежутки g0 = 9 (круг → кольцо 1), g1 = 7 (кольцо 1 → кольцо 2).</text>
<text x="60" y="1430" font-size="19"  fill="#111" font-family="Geist, 'Segoe UI', Arial, sans-serif">Оси групп 0°, 120°, 240° (азимут по часовой от вертикали); размах 72°, промежуток 48°;</text>
<text x="60" y="1460" font-size="19"  fill="#111" font-family="Geist, 'Segoe UI', Arial, sans-serif">торцы — радиальные лучи из C (у обеих дуг группы общие). Цвет #FA9506.</text>
